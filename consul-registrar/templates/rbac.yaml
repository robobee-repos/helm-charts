apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "consulRegistrar.serviceAccountName" .}}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "consulRegistrar.serviceAccountName" .}}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
rules:
  - apiGroups: ["v1","gateway.networking.k8s.io"]
    resources: ["services","gateways","gateways/status"]
    verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "consulRegistrar.serviceAccountName" .}}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ include "consulRegistrar.serviceAccountName" .}}
    namespace: {{ .Release.Namespace | quote }}
roleRef:
  kind: Role
  name: {{ include "consulRegistrar.serviceAccountName" .}}
  apiGroup: rbac.authorization.k8s.io
---
{{- if .Values.consulRegistrar.watchAllNamespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "consulRegistrar.serviceAccountName" .}}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - gateways
      - gateways/status
    verbs:
      - get
      - list
      - watch
  # Optional: allow reading GatewayClass (if you need to inspect gateway classes)
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - gatewayclasses
    verbs:
      - get
      - list
      - watch
  # If your registrar needs to read namespace metadata explicitly (not required for the script),
  # uncomment the following block:
  # - apiGroups: [""]
  #   resources:
  #     - namespaces
  #   verbs:
  #     - get
  #     - list
  #     - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "consulRegistrar.serviceAccountName" .}}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ include "consulRegistrar.serviceAccountName" .}}
    namespace: {{ .Release.Namespace | quote }}
roleRef:
  kind: ClusterRole
  name: {{ include "consulRegistrar.serviceAccountName" .}}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
