global
  log stdout format raw local0
  maxconn 2000
  stats socket /var/run/haproxy.sock mode 660 level admin
  daemon

defaults
  mode http
  timeout connect 5s
  timeout client 30s
  timeout server 30s

resolvers consul
  nameserver consul consul:8600
  parse-resolv-conf
  resolve_retries 3
  timeout resolve 1s
  hold valid 10s

frontend public-http
  bind 0.0.0.0:8080
  # default backend when no k8s-tagged services match
  default_backend backend-default

  # generate ACLs & use_backend rules for every service tagged "k8s"
        
        
  acl host_api-service hdr(host) -i api.example.local
  use_backend api-service-backend if host_api-service
        
        
  acl host_ldap-service hdr(host) -i ldap.example.local
  use_backend ldap-service-backend if host_ldap-service

backend backend-default
  mode http
  balance roundrobin
  timeout connect 1s
  timeout server 1s


# service: {api [k8s]}
# {1691d2c18081 b888a628-a2d2-8d89-1baa-7e73f5cc0130 127.0.0.1 map[lan:127.0.0.1 lan_ipv4:127.0.0.1 wan:127.0.0.1 wan_ipv4:127.0.0.1] map[consul-network-segment:] map[display_name:API Service vhost:api.example.local] 172.21.0.2 map[lan_ipv4:{172.21.0.2 80} wan_ipv4:{172.21.0.2 80}] api-1 api [k8s] [0x1f665e412d20] passing 80 {1 1}}
# service: {consul []}
# {1691d2c18081 b888a628-a2d2-8d89-1baa-7e73f5cc0130 127.0.0.1 map[lan:127.0.0.1 lan_ipv4:127.0.0.1 wan:127.0.0.1 wan_ipv4:127.0.0.1] map[consul-network-segment:] map[grpc_port:8502 grpc_tls_port:8503 non_voter:false raft_version:3 read_replica:false serf_protocol_current:2 serf_protocol_max:5 serf_protocol_min:1 version:1.15.4] 127.0.0.1 map[] consul consul [] [0x1f665e4d23c0] passing 8300 {1 1}}
# service: {ldap [k8s]}
# {1691d2c18081 b888a628-a2d2-8d89-1baa-7e73f5cc0130 127.0.0.1 map[lan:127.0.0.1 lan_ipv4:127.0.0.1 wan:127.0.0.1 wan_ipv4:127.0.0.1] map[consul-network-segment:] map[display_name:LDAP Service vhost:ldap.example.local] 172.21.0.4 map[lan_ipv4:{172.21.0.4 80} wan_ipv4:{172.21.0.4 80}] ldap-1 ldap [k8s] [0x1f665e504780] passing 80 {1 1}}



backend api-service-backend
  mode http
  balance roundrobin
  option httpchk GET /
  # create up to 5 servers from Consul DNS A records for 'api'
  server-template api-service 5 api.service.consul:80 resolvers consul init-addr none check



backend ldap-service-backend
  mode http
  balance roundrobin
  option httpchk GET /
  # create up to 5 servers from Consul DNS A records for 'ldap'
  server-template ldap-service 5 ldap.service.consul:80 resolvers consul init-addr none check

