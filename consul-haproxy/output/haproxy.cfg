global
  log stdout format raw local0
  maxconn 2000
  stats socket /var/run/haproxy.sock mode 660 level admin

defaults
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 30s
  timeout server 30s

resolvers consul
  nameserver consul consul:8600
  parse-resolv-conf
  resolve_retries 3
  timeout resolve 1s
  hold valid 10s

frontend stats
  bind *:8404
  mode http
  stats enable
  stats uri /
  stats refresh 10s
  stats auth admin:StrongPasswordHere
  stats hide-version

frontend public-http
  bind 0.0.0.0:8080
  # default backend when no k8s-tagged services match
  default_backend backend-default

  # generate ACLs & use_backend rules for every service tagged "k8s"
  acl host_api-service hdr(host) -i api.example.local
  use_backend api-service-backend if host_api-service
      
  acl host_ldap-service hdr(host) -i ldap.example.local
  use_backend ldap-service-backend if host_ldap-service
      

# HTTPS passthrough via SNI (terminate at Gateway; HAProxy must not decrypt)
frontend public-https
  bind 0.0.0.0:8443
  mode tcp
  option tcplog
  # wait for TLS ClientHello so req_ssl_sni is available
  tcp-request inspect-delay 5s
  tcp-request content accept if { req_ssl_hello_type 1 }
  default_backend backend-default-tcp

  # generate ACLs & use_backend rules for every service tagged "k8s"
  acl sni_api-service-tls- req_ssl_sni -i api.example.local
  use_backend api-service-tls--ssl-backend if sni_api-service-tls-
      
  acl sni_ldap-service-tls- req_ssl_sni -i ldap.example.local
  use_backend ldap-service-tls--ssl-backend if sni_ldap-service-tls-
      


backend backend-default
  log global
  mode http
  balance roundrobin
  timeout connect 1s
  timeout server 1s

backend backend-default-tcp
  mode tcp
  balance roundrobin
  option tcplog
  timeout check 3s


backend api-service-backend
  log global
  mode http
  balance roundrobin
  option httpchk GET / HTTP/1.1 api.example.local
  # create up to 5 servers from Consul DNS A records for 'api'
  server-template api-service 5 api.service.consul:80 resolvers consul init-addr none check


backend ldap-service-backend
  log global
  mode http
  balance roundrobin
  option httpchk GET / HTTP/1.1 ldap.example.local
  # create up to 5 servers from Consul DNS A records for 'ldap'
  server-template ldap-service 5 ldap.service.consul:80 resolvers consul init-addr none check


# # TCP backends for HTTPS/pass-through (no SSL on HAProxy -> keep TLS intact)
backend api-service-tls--ssl-backend
  mode tcp
  option tcplog
  balance roundrobin
  timeout check 3s
  # create up to 5 servers from Consul DNS A records for 'api'
  server-template api-service-tls- 5 api.service.consul:443 resolvers consul init-addr none check


backend ldap-service-tls--ssl-backend
  mode tcp
  option tcplog
  balance roundrobin
  timeout check 3s
  # create up to 5 servers from Consul DNS A records for 'ldap'
  server-template ldap-service-tls- 5 ldap.service.consul:443 resolvers consul init-addr none check



