global
  log stdout format raw local0
  maxconn 2000
  stats socket /var/run/haproxy.sock mode 660 level admin

defaults
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 30s
  timeout server 30s

resolvers consul
  nameserver consul consul-headless.kube-consul.svc.cluster.local:8600
  parse-resolv-conf
  resolve_retries 3
  timeout resolve 1s
  hold valid 10s

frontend stats
  bind *:8404
  mode http
  stats enable
  stats uri /
  stats refresh 10s
  stats auth admin:StrongPasswordHere
  stats hide-version

frontend public-http
  bind 0.0.0.0:8080
  # default backend when no k8s-tagged services match
  default_backend backend-default

  # generate ACLs & use_backend rules for every service tagged "k8s"
  #interscalar.com.muellerpublic.de
  acl host_interscalar-com-muellerpublic-de hdr(host) -i interscalar.com.muellerpublic.de
  use_backend interscalar-com-muellerpublic-de-backend if host_interscalar-com-muellerpublic-de
      
  #interscalar.org.muellerpublic.de
  acl host_interscalar-org-muellerpublic-de hdr(host) -i interscalar.org.muellerpublic.de
  use_backend interscalar-org-muellerpublic-de-backend if host_interscalar-org-muellerpublic-de
      
  #www.interscalar.com.muellerpublic.de
  acl host_www-interscalar-com-muellerpublic-de hdr(host) -i www.interscalar.com.muellerpublic.de
  use_backend www-interscalar-com-muellerpublic-de-backend if host_www-interscalar-com-muellerpublic-de
      
  #www.interscalar.org.muellerpublic.de
  acl host_www-interscalar-org-muellerpublic-de hdr(host) -i www.interscalar.org.muellerpublic.de
  use_backend www-interscalar-org-muellerpublic-de-backend if host_www-interscalar-org-muellerpublic-de
      
  #sso.muellerpublic.de
  acl host_sso-muellerpublic-de hdr(host) -i sso.muellerpublic.de
  use_backend sso-muellerpublic-de-backend if host_sso-muellerpublic-de
      
  #ldapmanager.anrisoftware.com
  acl host_ldapmanager-anrisoftware-com hdr(host) -i ldapmanager.anrisoftware.com
  use_backend ldapmanager-anrisoftware-com-backend if host_ldapmanager-anrisoftware-com
      
  #www.muellerpublic.de
  acl host_www-muellerpublic-de hdr(host) -i www.muellerpublic.de
  use_backend www-muellerpublic-de-backend if host_www-muellerpublic-de
      
  #muellerpublic.de
  acl host_muellerpublic-de hdr(host) -i muellerpublic.de
  use_backend muellerpublic-de-backend if host_muellerpublic-de
      
  #www.mueller-public.de
  acl host_www-mueller-public-de hdr(host) -i www.mueller-public.de
  use_backend www-mueller-public-de-backend if host_www-mueller-public-de
      
  #mueller-public.de
  acl host_mueller-public-de hdr(host) -i mueller-public.de
  use_backend mueller-public-de-backend if host_mueller-public-de
      

# HTTPS passthrough via SNI (terminate at Gateway; HAProxy must not decrypt)
frontend public-https
  bind 0.0.0.0:8443
  mode tcp
  option tcplog
  # wait for TLS ClientHello so req_ssl_sni is available
  tcp-request inspect-delay 5s
  tcp-request content accept if { req_ssl_hello_type 1 }
  default_backend backend-default-tcp

  # generate ACLs & use_backend rules for every service tagged "k8s"
  #interscalar.com.muellerpublic.de
  acl sni_interscalar-com-muellerpublic-de req_ssl_sni -i interscalar.com.muellerpublic.de
  use_backend interscalar-com-muellerpublic-de-ssl-backend if sni_interscalar-com-muellerpublic-de
      
  #interscalar.org.muellerpublic.de
  acl sni_interscalar-org-muellerpublic-de req_ssl_sni -i interscalar.org.muellerpublic.de
  use_backend interscalar-org-muellerpublic-de-ssl-backend if sni_interscalar-org-muellerpublic-de
      
  #www.interscalar.com.muellerpublic.de
  acl sni_www-interscalar-com-muellerpublic-de req_ssl_sni -i www.interscalar.com.muellerpublic.de
  use_backend www-interscalar-com-muellerpublic-de-ssl-backend if sni_www-interscalar-com-muellerpublic-de
      
  #www.interscalar.org.muellerpublic.de
  acl sni_www-interscalar-org-muellerpublic-de req_ssl_sni -i www.interscalar.org.muellerpublic.de
  use_backend www-interscalar-org-muellerpublic-de-ssl-backend if sni_www-interscalar-org-muellerpublic-de
      
  #sso.muellerpublic.de
  acl sni_sso-muellerpublic-de req_ssl_sni -i sso.muellerpublic.de
  use_backend sso-muellerpublic-de-ssl-backend if sni_sso-muellerpublic-de
      
  #ldapmanager.anrisoftware.com
  acl sni_ldapmanager-anrisoftware-com req_ssl_sni -i ldapmanager.anrisoftware.com
  use_backend ldapmanager-anrisoftware-com-ssl-backend if sni_ldapmanager-anrisoftware-com
      
  #www.muellerpublic.de
  acl sni_www-muellerpublic-de req_ssl_sni -i www.muellerpublic.de
  use_backend www-muellerpublic-de-ssl-backend if sni_www-muellerpublic-de
      
  #muellerpublic.de
  acl sni_muellerpublic-de req_ssl_sni -i muellerpublic.de
  use_backend muellerpublic-de-ssl-backend if sni_muellerpublic-de
      
  #www.mueller-public.de
  acl sni_www-mueller-public-de req_ssl_sni -i www.mueller-public.de
  use_backend www-mueller-public-de-ssl-backend if sni_www-mueller-public-de
      
  #mueller-public.de
  acl sni_mueller-public-de req_ssl_sni -i mueller-public.de
  use_backend mueller-public-de-ssl-backend if sni_mueller-public-de
      


backend backend-default
  log global
  mode http
  balance roundrobin
  timeout connect 1s
  timeout server 1s

backend backend-default-tcp
  mode tcp
  balance roundrobin
  option tcplog
  timeout check 3s



#interscalar.com.muellerpublic.de
backend interscalar-com-muellerpublic-de-backend
