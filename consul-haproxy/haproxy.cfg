  mode http
  balance roundrobin
  option httpchk GET / HTTP/1.1 interscalar.com.muellerpublic.de
  # create up to 5 servers from Consul DNS A records for 'interscalar-com-wordpress-gateway-0-http-interscalar-com-muellerpublic-de'
